{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Meal Buddy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/css/styles.css' %}">
</head>
<body class="bg-food">
  <div class="food-floating" aria-hidden="true">
    <span class="f">🍕</span>
    <span class="f">🍔</span>
    <span class="f">🍣</span>
    <span class="f">🌮</span>
    <span class="f">🍩</span>
    <span class="f">🥗</span>
    <span class="f">🍪</span>
    <span class="f">🍜</span>
    <span class="f">🧀</span>
  </div>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Meal Buddy</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"> 
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'open_show_restaurant' %}">Restaurants</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'open_signin' %}">Sign in</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admin_panel' %}">Admin Panel</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-light py-3 mt-4">
  <div class="container text-center small">© Meal Buddy</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
