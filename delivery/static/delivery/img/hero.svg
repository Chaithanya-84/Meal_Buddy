<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff9a76"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#fffaf6"/>
  <!-- phone mock -->
  <g transform="translate(180,100)">
    <rect x="0" y="0" width="240" height="520" rx="28" ry="28" fill="#fff" stroke="#f0f0f0" stroke-width="6"/>
    <rect x="12" y="24" width="216" height="472" rx="20" ry="20" fill="url(#g)"/>
    <!-- burger illustration -->
    <g transform="translate(36,120)">
      <ellipse cx="72" cy="140" rx="72" ry="24" fill="#e8a86b"/>
      <rect x="10" y="100" width="124" height="28" rx="12" fill="#f8b878"/>
      <rect x="16" y="92" width="112" height="18" rx="8" fill="#6ab04c"/>
      <rect x="18" y="74" width="108" height="18" rx="8" fill="#d97b48"/>
      <ellipse cx="72" cy="60" rx="72" ry="26" fill="#f6cf9a"/>
      <circle cx="52" cy="54" r="4" fill="#d97b48"/>
      <circle cx="86" cy="46" r="3" fill="#d97b48"/>
      <rect x="0" y="14" width="144" height="22" rx="11" fill="#fff7ed" opacity="0.08"/>
    </g>
    <!-- CTA text inside phone -->
    <g transform="translate(32,20)" fill="#fff" font-family="Segoe UI, Roboto, Arial" font-size="20">
      <text x="20" y="30">Meal Buddy</text>
      <text x="20" y="60" font-size="14" opacity="0.95">Your favorite food — delivered</text>
    </g>
  </g>
  <!-- decorative bowls -->
  <g transform="translate(40,820)">
    <circle cx="40" cy="40" r="40" fill="#8bd3ff" opacity="0.12"/>
    <circle cx="160" cy="60" r="60" fill="#ff9a76" opacity="0.12"/>
  </g>
</svg>
